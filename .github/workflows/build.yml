name: Build Athena AX6600 (RE-CS-02)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt 源码分支'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - openwrt-24.10
      with_daed:
        description: '交叉编译 NaiLink daed 并打进固件'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
  schedule:
    # 每周五 18:00 UTC = 每周六 02:00 北京时间
    - cron: '0 18 * * 5'

permissions:
  contents: write

env:
  BRANCH: ${{ inputs.branch || 'master' }}
  WITH_DAED: ${{ inputs.with_daed }}
  TZ: Asia/Shanghai

jobs:
  build:
    name: qualcommax / ipq60xx / jdcloud_re-cs-02
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: 1. 取出仓库
        uses: actions/checkout@v4

      - name: 2. 腾出磁盘（runner 只有 ~14G 可用）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get -qq clean
          docker image prune -a -f || true
          df -h /

      - name: 3. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pip python3-wheel rsync unzip zlib1g-dev file wget curl \
            dwarves libelf-dev device-tree-compiler cpio qemu-utils time \
            zstd xz-utils libfuse-dev subversion

      - name: 4. 恢复下载缓存（dl/）
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.BRANCH }}-${{ hashFiles('Config/**') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ env.BRANCH }}-${{ hashFiles('Config/**') }}-
            dl-${{ env.BRANCH }}-

      - name: 5. 拉取 ImmortalWrt 源码
        run: |
          git clone -b "$BRANCH" --depth=1 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_ENV"

      - name: 6. 安装 Go（交叉编译 daed 用）
        if: ${{ env.WITH_DAED != 'false' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: 7. 接入 feed / 四个插件 / .config
        run: |
          chmod +x Scripts/*.sh
          bash Scripts/packages.sh

      - name: 8. 下载源码包
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 9. 编译固件
        run: |
          cd openwrt
          set -o pipefail
          if ! make -j"$(nproc)" V=s > build.log 2>&1; then
            echo "=== 并行编译失败，末 300 行 ==="
            tail -n 300 build.log
            echo "=== 单线程重试 ==="
            make -j1 V=s 2>&1 | tail -n 300
          else
            tail -n 120 build.log
          fi

      - name: 10. 整理产物
        if: always()
        run: |
          mkdir -p out
          {
            echo "ImmortalWrt \`$BRANCH\` @ \`$SOURCE_COMMIT\`（$BUILD_DATE）"
            echo ""
            echo "目标：qualcommax / ipq60xx / JDCloud RE-CS-02（京东云雅典娜 AX6600）"
            echo "插件：NaiLink(daed-router) + clashoo + luci-theme-vantage + nikki"
            echo "内核：DEBUG_INFO_BTF + BPF_JIT + CGROUP_BPF（dae 依赖）"
            echo ""
            echo "刷机：U-Boot Web 页刷 sysupgrade.bin，或 sysupgrade -n"
          } > out/BUILD-INFO.txt
          if [ -d openwrt/bin/targets/qualcommax/ipq60xx ]; then
            cp -v openwrt/bin/targets/qualcommax/ipq60xx/*.bin        out/ 2>/dev/null || true
            cp -v openwrt/bin/targets/qualcommax/ipq60xx/*.itb        out/ 2>/dev/null || true
            cp -v openwrt/bin/targets/qualcommax/ipq60xx/*.manifest   out/ 2>/dev/null || true
            cp -v openwrt/bin/targets/qualcommax/ipq60xx/sha256sums   out/ 2>/dev/null || true
          fi
          if [ -d openwrt/bin/packages ]; then
            tar -czf "out/packages-aarch64_cortex-a53.tar.gz" \
              -C openwrt/bin/packages . 2>/dev/null || true
          fi
          ls -lh out/

      - name: 11. 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-re-cs-02-${{ env.BRANCH }}-run${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: 12. 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.bin
            out/*.itb
            out/sha256sums
            out/*.manifest
            out/packages-aarch64_cortex-a53.tar.gz
          name: ${{ github.ref_name }} (RE-CS-02 / ${{ env.BRANCH }})
          body_path: out/BUILD-INFO.txt
          draft: false
          prerelease: false
